<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de fundo escuro corporativo Contek (#0D1B2A) -->
    <linearGradient id="contekBg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B2A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Gradiente externo do Símbolo C Contek: Azul #1E3A8A -> Ciano #06B6D4 -> Verde #22C55E -->
    <linearGradient id="contekOuter512" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="45%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <!-- Gradiente interno do Símbolo C Contek: Ciano #06B6D4 -> Verde #22C55E -> Lima #84CC16 -->
    <linearGradient id="contekInner512" x1="20%" y1="90%" x2="90%" y2="20%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="65%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>

    <filter id="contekGlow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#06B6D4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fundo do ícone Squircle PWA -->
  <rect width="512" height="512" rx="120" fill="url(#contekBg512)" />
  <rect x="6" y="6" width="500" height="500" rx="114" fill="none" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.25" />

  <!-- Símbolo C Oficial da CONTEK centralizado -->
  <g filter="url(#contekGlow512)" transform="translate(56, 56) scale(4)">
    <!-- Arco externo do C -->
    <path
      d="M 68 22 C 55 12 36 14 24 26 C 10 40 10 60 24 74 C 36 86 55 88 68 78"
      stroke="url(#contekOuter512)"
      stroke-width="13"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Arco interno do C -->
    <path
      d="M 58 36 C 48 28 38 30 32 38 C 24 46 24 54 32 62 C 38 70 48 72 58 64"
      stroke="url(#contekInner512)"
      stroke-width="8"
      stroke-linecap="round"
      fill="none"
    />
  </g>
</svg>
