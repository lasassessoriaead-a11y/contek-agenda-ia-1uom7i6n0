<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de fundo do squircle oficial AGYLI -->
    <linearGradient id="agyliTileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="30%" stop-color="#2563EB" />
      <stop offset="70%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Gradiente do arco principal da letra 'a' -->
    <linearGradient id="agyliMainArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Gradiente da curva esquerda/inferior -->
    <linearGradient id="agyliInnerCurve" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Sombra suave para o emblema interno -->
    <filter id="subtleDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fundo do ícone com cantos arredondados padrão App / PWA (squircle) -->
  <rect width="512" height="512" rx="120" fill="url(#agyliTileBg)" />

  <!-- Borda sutil de destaque superior -->
  <rect x="6" y="6" width="500" height="500" rx="114" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.2" />

  <!-- Emblema Oficial 'a' da AGYLI -->
  <g filter="url(#subtleDrop)">
    <!-- Curva do bojo / arco inferior esquerdo -->
    <path
      d="M 270 195 C 205 195 155 245 155 310 C 155 375 205 410 270 410 C 300 410 325 398 345 380 L 345 330 C 330 355 295 365 270 365 C 230 365 205 340 205 310 C 205 280 230 255 270 255 C 305 255 345 275 345 305"
      fill="none"
      stroke="url(#agyliInnerCurve)"
      stroke-width="50"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Arco superior contínuo e haste descendente curva da letra 'a' -->
    <path
      d="M 205 285 C 205 190 270 125 360 125 C 410 125 435 155 435 200 L 435 370 C 435 405 405 425 375 425 C 345 425 325 400 325 370 L 325 290 C 325 210 290 170 240 170 C 200 170 175 195 165 225"
      fill="none"
      stroke="url(#agyliMainArch)"
      stroke-width="52"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
