<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background do app icon oficial MARKALY -->
    <linearGradient id="markaly-pwa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2E0854" />
      <stop offset="50%" stopColor="#3B0764" />
      <stop offset="100%" stopColor="#1E0338" />
    </linearGradient>

    <!-- Gradiente oficial do M: Laranja -> Rosa Coral -> Roxo -->
    <linearGradient id="markaly-pwa-grad" x1="10%" y1="90%" x2="90%" y2="20%">
      <stop offset="0%" stopColor="#F97316" />
      <stop offset="50%" stopColor="#EC4899" />
      <stop offset="100%" stopColor="#7C3AED" />
    </linearGradient>

    <linearGradient id="markaly-pwa-left" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stopColor="#F97316" />
      <stop offset="70%" stopColor="#FB923C" />
      <stop offset="100%" stopColor="#F43F5E" />
    </linearGradient>

    <linearGradient id="markaly-pwa-center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#EC4899" />
      <stop offset="100%" stopColor="#A855F7" />
    </linearGradient>

    <linearGradient id="markaly-pwa-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8B5CF6" />
      <stop offset="100%" stopColor="#6D28D9" />
    </linearGradient>
  </defs>

  <!-- Fundo Squircle Suave -->
  <rect width="512" height="512" rx="112" fill="url(#markaly-pwa-bg)" />

  <!-- Geometria do M oficial -->
  <g transform="translate(50, 75) scale(4.1)">
    <!-- Dobra traseira direita (Roxo) -->
    <path
      d="M 68 82 C 63 82 59 77 62 70 L 78 28 C 80 23 85 20 90 23 C 95 26 97 32 94 38 L 78 80 C 76 83 72 85 68 85 Z"
      fill="url(#markaly-pwa-right)"
      opacity="0.95"
    />

    <!-- Arco superior direito / transição -->
    <path
      d="M 52 48 C 50 32 62 20 76 22 C 86 24 92 34 88 46 L 76 74 C 74 78 69 80 65 77 C 61 74 61 68 64 64 L 72 44 C 74 39 70 34 65 33 C 58 32 53 38 52 48 Z"
      fill="url(#markaly-pwa-center)"
    />

    <!-- Arco frontal esquerdo em fita fluida (Laranja para Rosa) -->
    <path
      d="M 12 76 C 7 70 8 60 14 52 L 32 28 C 38 20 49 19 55 26 C 61 33 60 44 54 52 L 36 76 C 30 84 19 84 12 76 Z"
      fill="url(#markaly-pwa-left)"
    />

    <!-- Curva de conexão contínua inferior -->
    <path
      d="M 28 58 C 34 48 44 42 52 46 C 58 50 56 60 50 68 C 44 76 34 78 28 72 C 24 68 25 62 28 58 Z"
      fill="url(#markaly-pwa-grad)"
    />
  </g>
</svg>
